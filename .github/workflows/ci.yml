# .github/workflows/ci.yml
# Runs automated linting, test suites, security gates, and DeepEval checks on PRs and pushes.

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test & Security Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package & Dev Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check src tests evals

      - name: Run Full Pytest Suite (Unit, Contract, Integration Phases 1-4, Security)
        run: |
          PYTHONPATH=src pytest tests

      - name: Run DeepEval CI Gate
        run: |
          PYTHONPATH=src python3 evals/deepeval_suite.py
