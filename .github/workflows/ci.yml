# .github/workflows/ci.yml
# Runs automated linting, test suites, and type checking on pull requests and pushes.

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Contract Tests
        run: |
          PYTHONPATH=src python3 tests/contract/test_contracts.py

      - name: Run Phase 1 Spine Tests
        run: |
          PYTHONPATH=src python3 tests/integration/test_phase1_spine.py

      - name: Run Phase 2 Intelligence Tests
        run: |
          PYTHONPATH=src python3 tests/integration/test_phase2_intelligence.py
