name: Build and Publish Container Image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF_NAME="${{ github.ref_name }}"
          if [ "$REF_NAME" = "main" ]; then
            IMAGE_TAG="ghcr.io/${OWNER}/vulnflow:latest,ghcr.io/${OWNER}/vulnflow:main"
          else
            # Sanitize branch name for Docker tag: lowercase, replace slashes and invalid chars with dashes
            SANITIZED_BRANCH=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g')
            IMAGE_TAG="ghcr.io/${OWNER}/vulnflow:${SANITIZED_BRANCH}"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Target image tag: ${IMAGE_TAG}"

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Image Digest
        run: echo "Published image digest:${{ steps.docker_build.outputs.digest }}"
