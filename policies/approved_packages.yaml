# policies/approved_packages.yaml
# Approved package names, allowed version ranges, and registry sources.

packages:
  - name: lodash
    ecosystem: npm
    approved_versions: ">=4.17.21"
    status: approved
  - name: moment
    ecosystem: npm
    status: deprecated
    replacement: date-fns
    reason: "Upstream deprecated in favor of modular date libraries"
  - name: left-pad
    ecosystem: npm
    status: banned
    reason: "Unmaintained and obsolete utility package"
  - name: express
    ecosystem: npm
    approved_versions: ">=4.19.2"
    status: approved
  - name: axios
    ecosystem: npm
    approved_versions: ">=1.7.4"
    status: approved

rules:
  unknown_package: require_approval
  apply_to_transitive: true
  licenses_denied:
    - GPL-3.0
    - AGPL-3.0
  licenses_allowed:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - BSD-2-Clause
    - ISC
