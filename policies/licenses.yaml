# policies/licenses.yaml
# Defines permitted, restricted, and banned open source software licenses.

allowed:
  - MIT
  - Apache-2.0
  - BSD-3-Clause
  - BSD-2-Clause
  - ISC
  - CC0-1.0
  - Unlicense

restricted:
  - LGPL-2.1
  - LGPL-3.0
  - MPL-2.0
  - CDDL-1.0

denied:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - SSPL-1.0
  - Commons-Clause
