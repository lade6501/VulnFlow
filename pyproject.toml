# pyproject.toml
# Defines build configuration, package metadata, dependencies, and tooling settings for VulnFlow.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnflow"
version = "0.2.0"
description = "AI-driven autonomous vulnerability remediation engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VulnFlow Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]

# Core runtime dependencies
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# LangGraph stateful agent framework
orchestrator = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

# REST API & Webhook server
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

# External vector store & knowledge graph extensions
knowledge = [
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "neo4j>=5.0",
]

# Official Anthropic Model Context Protocol SDK
mcp = [
    "mcp>=1.0.0",
]

# Observability and distributed tracing
tracing = [
    "langsmith>=0.1.0",
]

# Cloud provider integrations (e.g. AWS Bedrock)
cloud = [
    "boto3>=1.34.0",
]

# Development & testing
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.26.0",
    "ruff~=0.17.6",
    "mypy~=2.4.1",
    "types-PyYAML",
]

# Full stack bundle
all = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "neo4j>=5.0",
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "langsmith>=0.1.0",
]

[project.scripts]
vulnflow = "vulnflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnflow.reporting" = ["templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Direct entry points bootstrap imports first.
"api/main.py" = ["E402"]
"src/vulnflow/cli.py" = ["E402"]
"src/vulnflow/api/builtin_server.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "api"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# These integrations are optional in the core developer environment.
module = ["boto3", "fastapi", "fastapi.*", "langgraph", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_default_fixture_loop_scope = "function"
