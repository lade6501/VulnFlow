# pyproject.toml
# Defines build configuration, package metadata, dependencies, and tooling settings for VulnFlow.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnflow"
version = "0.2.0"
description = "AI-driven autonomous vulnerability remediation engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VulnFlow Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]

# Core runtime dependencies
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# LangGraph stateful agent framework
orchestrator = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

# REST API & Webhook server
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

# External vector store & knowledge graph extensions
knowledge = [
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "neo4j>=5.0",
]

# Official Anthropic Model Context Protocol SDK
mcp = [
    "mcp>=1.0.0",
]

# Cloud provider integrations (e.g. AWS Bedrock)
cloud = [
    "boto3>=1.34.0",
]

# Development & testing
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

# Full stack bundle
all = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "neo4j>=5.0",
    "mcp>=1.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
vulnflow = "vulnflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
